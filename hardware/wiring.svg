<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="title desc">
  <title id="title">Mains relay wiring</title>
  <desc id="desc">Mains enters the 1541 case's AC inlet. The hot wire goes through the power switch and, in parallel with it, the 240D45 relay's load terminals, then through the fuse to the Mean Well RS-25-5 and the 1541's transformer. Neutral goes straight to both supplies, and earth to the chassis. The RS-25-5's 5 VDC and the transformer's 9 VAC leave through the C64 power cable to the machine. The Teensy 3.1, powered by the PC over USB, drives the relay's input from pin 2 and GND.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .outline { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 6 4; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #1f2328; }
    .t { font-size: 14.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #59636e; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .hot { stroke: #cf222e; stroke-width: 2.4; fill: none; }
    .neu { stroke: #8250df; stroke-width: 2.4; fill: none; }
    .earth { stroke: #1a7f37; stroke-width: 2.2; fill: none; }
    .pwr { stroke: #9a6700; stroke-width: 2.4; fill: none; }
    .usb { stroke: #0969da; stroke-width: 2.4; fill: none; }
    .sig { stroke: #424a53; stroke-width: 1.8; fill: none; }
    .plug { stroke: #424a53; stroke-width: 9; fill: none; }
    .core { stroke: #f6f8fa; stroke-width: 3.5; fill: none; }
    .dhot { fill: #cf222e; }
    .dneu { fill: #8250df; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #6e7681; }
      .outline { stroke: #6e7681; }
      text { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .hot { stroke: #ff7b72; }
      .neu { stroke: #a371f7; }
      .earth { stroke: #3fb950; }
      .pwr { stroke: #d29922; }
      .usb { stroke: #4493f8; }
      .sig { stroke: #b7bdc8; }
      .plug { stroke: #b7bdc8; }
      .core { stroke: #161b22; }
      .dhot { fill: #ff7b72; }
      .dneu { fill: #a371f7; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="490" rx="10"/>

  <!-- outside the case -->
  <rect class="box" x="16" y="60" width="120" height="56" rx="8"/>
  <text class="t c" x="76" y="84">PC</text>
  <text class="s c" x="76" y="102">host over USB serial</text>

  <rect class="box" x="16" y="250" width="120" height="56" rx="8"/>
  <text class="t c" x="76" y="274">Mains</text>
  <text class="s c" x="76" y="292">120 V outlet</text>

  <rect class="box" x="906" y="220" width="80" height="80" rx="8"/>
  <text class="t c" x="946" y="256">Machine</text>
  <text class="s c" x="946" y="274">C64 or C128</text>

  <!-- the case -->
  <rect class="outline" x="170" y="28" width="660" height="420" rx="10"/>
  <text class="s" x="182" y="46">the 1541 case</text>

  <rect class="box" x="196" y="170" width="70" height="230" rx="6"/>
  <text class="t c" x="231" y="194">AC inlet</text>
  <text class="s e" x="260" y="259">L</text>
  <text class="s e" x="260" y="369">N</text>

  <path class="plug" d="M136,278 H196"/>
  <path class="core" d="M136,278 H196"/>
  <text class="s c" x="152" y="266">cord</text>

  <!-- the controller and the relay's input -->
  <rect class="box" x="320" y="60" width="180" height="60" rx="8"/>
  <text class="t c" x="410" y="84">Teensy 3.1</text>
  <text class="s c" x="410" y="102">on the proto board</text>

  <path class="usb" d="M136,88 H320"/>
  <text class="s c" x="245" y="80">USB: power and serial</text>

  <path class="sig" d="M380,120 V170"/>
  <path class="sig" d="M440,120 V170"/>
  <text class="s e" x="374" y="150">pin 2 → 3+</text>
  <text class="s" x="446" y="150">GND → 4−</text>

  <!-- the hot side: switch and relay in parallel, then the fuse -->
  <rect class="box" x="320" y="170" width="180" height="60" rx="8"/>
  <text class="t c" x="410" y="194">240D45 relay</text>
  <text class="s c" x="410" y="212">load terminals 1, 2</text>

  <rect class="box" x="320" y="280" width="180" height="56" rx="8"/>
  <text class="t c" x="410" y="303">Power switch</text>
  <text class="s c" x="410" y="321">ON = bypass, off = AUTO</text>

  <path class="hot" d="M266,255 H295"/>
  <path class="hot" d="M320,200 H295 V308 H320"/>
  <path class="hot" d="M500,200 H530 V308 H500"/>
  <path class="hot" d="M530,255 H560"/>
  <circle class="dhot" cx="295" cy="255" r="3.5"/>
  <circle class="dhot" cx="530" cy="255" r="3.5"/>

  <rect class="box" x="560" y="235" width="70" height="40" rx="6"/>
  <text class="t c" x="595" y="260">Fuse</text>

  <!-- the supplies -->
  <path class="hot" d="M630,255 H655"/>
  <path class="hot" d="M690,190 H655 V310 H690"/>
  <circle class="dhot" cx="655" cy="255" r="3.5"/>

  <rect class="box" x="690" y="170" width="120" height="60" rx="8"/>
  <text class="t c" x="750" y="194">RS-25-5</text>
  <text class="s c" x="750" y="212">Mean Well, 5 VDC</text>

  <rect class="box" x="690" y="290" width="120" height="60" rx="8"/>
  <text class="t c" x="750" y="314">Transformer</text>
  <text class="s c" x="750" y="332">the 1541's, 9 VAC</text>

  <!-- neutral, straight to both supplies; it hops the hot wire to the transformer -->
  <path class="neu" d="M266,365 H672 V316 A6,6 0 0 1 672,304 V212 H690"/>
  <path class="neu" d="M672,330 H690"/>
  <circle class="dneu" cx="672" cy="330" r="3.5"/>

  <!-- earth -->
  <path class="earth" d="M231,400 V420 M219,420 H243 M223,426 H239 M227,432 H235"/>
  <text class="s" x="250" y="428">chassis</text>

  <!-- the outputs, through the C64 power cable -->
  <path class="pwr" d="M810,200 H868 V240 H906"/>
  <path class="pwr" d="M810,320 H868 V280 H906"/>
  <text class="s c" x="868" y="258">C64 power</text>
  <text class="s c" x="868" y="272">cable</text>

  <!-- legend -->
  <g transform="translate(0,472)">
    <path class="hot" d="M16,0 H44"/>
    <text class="s" x="50" y="4">hot (L)</text>
    <path class="neu" d="M110,0 H138"/>
    <text class="s" x="144" y="4">neutral (N)</text>
    <path class="earth" d="M226,0 H254"/>
    <text class="s" x="260" y="4">earth</text>
    <path class="pwr" d="M310,0 H338"/>
    <text class="s" x="344" y="4">supply outputs</text>
    <path class="usb" d="M440,0 H468"/>
    <text class="s" x="474" y="4">USB</text>
    <path class="sig" d="M516,0 H544"/>
    <text class="s" x="550" y="4">relay input</text>
    <path class="plug" d="M630,0 H658"/>
    <path class="core" d="M630,0 H658"/>
    <text class="s" x="664" y="4">mains cord</text>
    <circle class="dhot" cx="752" cy="0" r="3.5"/>
    <text class="s" x="762" y="4">joined</text>
  </g>
</svg>
